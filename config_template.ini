[common]
; 使用cookie登录，填写true则忽略账号密码，直接从cookies.txt读取cookie登录
use_cookies=false

; 手机号账号(必填)
username = xxx

; 登录密码(必填)
password = xxx

; 要学习的课程ID列表, 逗号隔开(选填，不需要则留空)
course_list = xxx,xxx,xxx

; 视频播放倍速 —— 已固定为 1 倍速(此项仅为兼容旧配置保留)
; 超星的时长校验看的是「真实耗时」与「上报进度」是否匹配,
; 倍速下真实 30 分钟走完 60 分钟的视频, 很容易被判异常、漏计任务点,
; 所以这里写任何值都会被强制改为 1, 程序启动时会打印提示
speed = 1

; 同时处理的章节数量 (默认 1 = 按顺序处理)
; 注意: 视频播放已经全局串行, 这里调到 4 也仍然是一个视频播完再播下一个,
; 只对文档 / 测验 / 阅读这类不占时长的任务点有加速作用。
; 想尽量贴近「真人逐章学习」的节奏, 保持 1 即可。
jobs = 1

; 单次运行时长上限(分钟), 0 或留空表示不限制
; 到点后不再开始新的章节 / 作业 / 考试, 正在执行的任务(正在播的视频、正在写的作业)
; 会跑完再退出。命令行 --max-runtime 优先级更高。
; 用途: 学校要求不能一次性把课刷完时, 把它设成 90~120, 再配合定时任务,
;       就是"每次跑一段、隔几小时再跑下一段"的分段刷课, 和真人节奏接近。
; 注意这是软上限: 一个 90 分钟的视频从第 80 分钟开始播, 仍会播完才退出。
max_runtime_minutes = 0

; 遇到关闭任务点时的行为: retry-重试(默认), continue-继续
notopen_action = retry

; 开了人脸采集的视频直接跳过, 默认 true
; 这类视频把进度推到片尾服务端也不认(isPassed=false), 甚至直接 403 —— 纯 HTTP 做不过去。
; 跳过它继续做本节测验, 比播一遍再从头重播一遍划算得多。
; 想确认是不是误判(其实是别的原因)时, 可以临时改成 false 让它照常播一遍。
skip_face_capture = true

; 跳过记录簿: 记录「哪个任务点、为什么过不去」, 下次运行据此直接跳过
;   true  -> 落盘到 skip_registry.json, 跨运行有效(Actions 里由 cache 保存)
;   false -> 只在本次运行内记住, 不落盘
skip_registry = true

; 记录簿文件名(一般不用改)
skip_registry_file = skip_registry.json
[tiku]
; 可选项 :
; 1. TikuYanxi(言溪题库 https://tk.enncy.cn/)
; 2. TikuLike(LIKE知识库 https://www.datam.site/)
; 3. TikuAdapter(开源项目 https://github.com/DokiDoki1103/tikuAdapter)
; 4. AI(需自行寻找兼容openai格式的API Endpoint和Key)
; 5. SiliconFlow(硅基流动AI：https://siliconflow.cn/)
; 6. TikuGo(GO题/网课小工具题库 https://q.icodef.com/)
; 7. DeepSeek(用 [ai] 节填的 Key 让 DeepSeek 答题, 需先填好 [ai] 的 api_key)
; 支持配置多个题库回退，按顺序依次查询，示例：provider=TikuGo,DeepSeek
provider=TikuYanxi

; 是否启用大模型连接检查，填写 true 表示在启动时检查大模型连接是否可用，false 表示不检查
; 仅在使用 AI 或 SiliconFlow 题库时生效，会消耗少量token
check_llm_connection=true

; 是否提交答题，填写false表示答完题后不提交而是保存搜到的题目，随后你可以自行前往学习通修改或提交
; 填写true表示达到最低题库覆盖率提交，没达到只保存搜到的题目，进入下一章节，不保证正确率！不正确的填写会被视为false
; 题库覆盖率-搜到的题目占总题目的比例
; 对于那些需要解锁的章节，你必须要提交章节检测才能继续下一章节的学习，自行决定是否开启
; 选择提交答题但题库覆盖率不达标时，若是需要解锁的章节，保存后会回滚重新答题且忽略搜到率提交
submit=false

; 最低题库覆盖率
cover_rate=0.9

; 搜索多个题目时间隔的时间，单位秒
delay=1.0

; 用于言溪题库的TOKEN，同样使用英文逗号隔开多个，会按顺序去使用
; 或用于LIKE知识库的TOKEN，在使用LIKE知识库时会随机调用token进行查询。
tokens=

; 下面是用于LIKE知识库模型的专属配置，其他题库无需关注下列选项
; likeapi_search=true表示启用模型的联网搜索功能，false则不启用联网搜索
; likeapi_vision=true表示启用模型的视觉能力，false则不启用视觉能力（可以识别图片中的内容并进行答题，支持超星url格式的文本图片题）
; likeapi_model=glm-4.5-air表示使用glm-4.5-air模型，其他模型请自行查询
; likeapi_retry=true表示启用自动重试功能，false则关闭该功能
; likeapi_retry_times设置最大重试次数
; 模型支持列表：https://www.datam.site/dashboard/pricing
likeapi_search=false
likeapi_vision=true
likeapi_model=glm-4.5-air
likeapi_retry=true
likeapi_retry_times=3
; 用于TikuAdapter题库的url
url=

; 用于GO题（网课小工具题库）的配置
; go_authorization 为公众号"一之哥哥"中申请到的解除限流的Token（可选）
; go_min_interval 设置请求GO题库的最小时间间隔，单位秒，默认为1.0秒
; go_retry_times 设置请求GO题库的重试次数，默认为3次
; go_retry_backoff 设置请求GO题库的重试指数退避基数，默认为1.2倍
go_authorization=
go_min_interval=1.0
go_retry_times=3
go_retry_backoff=1.2

; 用于AI大模型答题的API Endpoint和Key
; 请注意API Endpoint可能需要带上/v1路径，例如: https://example.com/v1
; min_interval_seconds 为 API 请求的最小间隔时间，单位秒, 0表示不限制
endpoint=
key=
model=
; 请求间隔时间
min_interval_seconds=3
; 可选配置请求大模型时使用的代理，填写示例：http://examples.com
http_proxy=

;硅基流动AI专属配置，以siliconflow开头的
;硅基流动获取token的地址https://cloud.siliconflow.cn/account/ak
siliconflow_key = 
;可选模型deepseek-ai/DeepSeek-R1;deepseek-ai/DeepSeek-V3等，这里查看https://docs.siliconflow.cn/cn/api-reference/chat-completions/chat-completions
siliconflow_model = deepseek-ai/DeepSeek-R1
; 可选自定义端点
siliconflow_endpoint = https://api.siliconflow.cn/v1/chat/completions
; 请求间隔时间
; min_interval_seconds = 3 请将硅基流动请求间隔时间填入第52行，不要去掉此行注释，否则会重复导致报错（临时解决）

; 用于判断判断题对应的选项，不要留有空格，不要留有引号，逗号为英文逗号
true_list=正确,对,√,是
false_list=错误,错,×,否,不对,不正确

[ai]
; ===== DeepSeek AI 搜题答题 =====
; 只需要填 api_key 就能用, 其余全部有默认值
; 申请 Key: https://platform.deepseek.com/api_keys

; 你的 DeepSeek API Key（必填，留空则 AI 答题不启用）
api_key =

; 接口地址(OpenAI 兼容格式), 一般不用改
base_url = https://api.deepseek.com

; 模型名, deepseek-flash 对应 DeepSeek-V4.1-Flash
model = deepseek-flash

; AI 使用方式:
; fallback - 先查题库, 题库没命中再问 AI（推荐, 最省钱）
; priority - 直接让 AI 答, AI 失败再查题库（没配题库时用这个）
; off      - 关闭 AI
mode = fallback

; 温度, 答题建议 0 ~ 0.3, 越低越稳定
temperature = 0.2

; 单题输出上限。开着 thinking 时如果你填的值小于 4096, 会被自动抬到 4096
; (思考过程也占输出配额, 额度太小会把配额吃光, 模型返回空内容)
max_tokens = 1024

; 单次请求超时时间(秒)
timeout = 60

; 单题失败重试次数
max_retries = 3

; 并发请求数, 过高容易触发限流(报 429), 一般 2 ~ 6
concurrency = 4

; 每两次请求之间的最小间隔(秒), 0 表示不限制
min_interval_seconds = 0

; 深度思考模式
;   true  -> 先推理再作答, 计算题/多选/概念辨析更准, 但慢一些、token 也更多(默认)
;   false -> 直接给答案, 快且省 token, 适合纯记忆型的选择题
; 网页版「深度思考」就是这个开关; 用 Actions 的话在 Variables 里设 AI_THINKING=false 可关掉
thinking = true

; 是否缓存答案到 ai_cache.json, 重复题目不再重复请求
cache = true
cache_file = ai_cache.json

; 启动时是否检查 Key 是否可用(会消耗极少 token)
check_connection = true

[answer]
; 作业 + 考试 自动答题
; 这一节同时控制三处答题:
;   1. 课程「作业」列表里的作业
;   2. 课程「考试」列表里的考试
;   3. 章节里的测验任务点(也就是「每小节一份作业」的那份)
; 三者共用下面的 submit_policy / min_cover_rate, 答不出来时统一降级到大模型。

; 总开关, 也可以在命令行用 --auto-answer 临时开启
enable = false

; 作业和刷课谁先做:
;   after  - 先把本节/本课的内容学完, 再做作业和考试(默认)
;   before - 先做作业再刷视频
;   both   - 前后各扫一遍
;
; 默认 after 是因为作业和考试基本都是「学完前面几节才解锁」的,
; 抢在前面做只会撞上"未开始/未解锁"而白跑一趟。
; 注意这是**每门课内部**的顺序: 第 1 门课刷完课、做完作业, 才进第 2 门课,
; 不是所有课刷完才统一做题。所以中途就算撞上时长上限, 前面的课也是完整的。
order = after

; 是否处理作业 / 考试, 可以只开其中一个
;
; 作业一般可以补交, 开了比较省事(默认做)。
; 考试默认**不代考**: 通常是「学习进度达到一定百分比后才解锁」的, 而且次数有限,
; 一旦交了就不能改答案, 所以默认留给用户自己考:
;   想让程序代考     -> exam = true  (命令行 --exam)
;   想自己考         -> exam = false (默认, 命令行 --no-exam)
; 命令行优先级高于这里; 两个都不写就按这个值。
; 不考试不影响「看视频 + 做题(作业/章节测验) + 完成任务点」。
work = true
exam = false

; 答题后如何处理:
; auto   - 题库覆盖率达到 min_cover_rate 才提交, 否则只保存草稿(推荐)
; always - 答完直接提交
; never  - 只填写并保存, 留给你自己检查后手动提交
submit_policy = auto

; auto 模式下的最低题库覆盖率, 低于这个值只保存不提交
min_cover_rate = 0.9

; 每门课最多处理多少份作业/考试, 防止一次跑太多
max_tasks = 20

; 考试是否排在作业前面(推荐 true)
; 考试有截止时间、过了就没了; 作业通常还能补交。
; 开了这个, 时间盒到点时会先保住考试。
exam_priority = true

; 距本次运行上限还剩多少分钟时, 不再开始新的考试
; 考试一旦点掉「开始考试」就开始倒计时, 中途被掐断会浪费一次考试机会,
; 所以剩余时间不够就留给下次运行。设 0 表示不检查(不推荐)。
exam_min_remaining = 15

; 打开后会把抓到的作业/考试原始页面存到 answer_debug/ 目录,
; 解析不出题目时用它对着真实页面排查
debug = false
[notification]
provider=ServerChan
; 可选项 :
; 1. ServerChan(Server酱 多平台推送 https://sct.ftqq.com/)
; 2. Qmsg(Qmsg酱 qq推送 https://qmsg.zendee.cn/)
; 3. Bark(Bark ios推送 https://bark.day.app/)
; 4. Telegram(Telegram Bot推送 https://api.telegram.org/  可以使用第三方中转API)
; 外部通知服务的提供方
url=
; Server酱,Qmsg酱或Bark的url,以下为例子，需要自己将key填入*号位置
; https://sctapi.ftqq.com/****************.send Server酱
; https://qmsg.zendee.cn/send/**************** Qmsg酱
; https://api.day.app/**************/ Bark的高级用法请自行查阅app与其文档的说明（高级用法不一定能行，没测试过）
; https://api.telegram.org/bot**********:***********************/sendMessage Telegram(具体用法请查阅Telegram官方API文档)
; Telegram推送时使用的chat_id
tg_chat_id=XXXXXX