name: 刷课
 
on: 
  # 只保留两种「你要它跑它才跑」的启动方式, 不再挂定时任务。
  #
  # 为什么去掉 schedule: GitHub 的 cron 是「尽力而为」, 高峰期经常延迟十几分钟到
  # 一小时, 甚至整次跳过 —— 想按固定时间刷课根本对不上。现在改成:
  #   * 手动触发: Actions 页面 -> 刷课 -> Run workflow(可以顺手填本次时长);
  #   * 推一次 commit 也会触发(push 到 main), 改完代码提交即开跑。
  # 一次运行跑到 MAX_RUNTIME_MINUTES 就自己收尾退出, 下次等你再手动开。
  push:
    branches: [ main ]
  workflow_dispatch:   # 支持在 Actions 页面手动触发
    inputs:
      max_runtime:
        description: "本次运行时长上限(分钟)。留空则用仓库变量 MAX_RUNTIME_MINUTES, 都没设就是 110"
        required: false
        default: ""


jobs: 
  Start:
    runs-on: ubuntu-latest # 在最新版本的 Ubuntu 操作系统环境下运行
    # 兜底: 即使程序自身没退出, 也不让这个 job 一直挂着(Actions 单 job 上限 6 小时)
    timeout-minutes: 350
    steps: # 要执行的步骤
      - name: 拷贝代码
        uses: actions/checkout@v4  # 用于将github代码仓库的代码拷贝到工作目录中
 
      - name: 设置python环境
        uses: actions/setup-python@v5 # 用于设置 Python 环境，它允许你指定要在工作环境中使用的 Python 版本
        with:
          python-version: '3.13'  # 选择要用的Python版本
 
      - name: 安装依赖包
        run: | # 安装依赖包
          pip install -r ./requirements.txt 
          
      - name: 恢复跳过记录(跨运行)
        uses: actions/cache@v4
        with:
          # 记录「哪个任务点做不过去(例如开了人脸采集)」, 下次运行直接跳过,
          # 不再把同一个视频从头播一遍。key 带 run_id 保证每次都存一份新的,
          # restore-keys 前缀命中最近一份, 所以记录会一直累积下去。
          path: skip_registry.json
          key: skip-registry-${{ github.run_id }}
          restore-keys: |
            skip-registry-

      - name: 恢复 AI 答案缓存(跨运行)
        uses: actions/cache@v4
        with:
          # 同一道题不重复问模型, 省钱也省时间
          path: ai_cache.json
          key: ai-cache-${{ github.run_id }}
          restore-keys: |
            ai-cache-

      
      - name: Run main.py
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
          # 在仓库 Settings -> Secrets and variables -> Actions 里添加 DEEPSEEK_API_KEY
          # 就会自动开启「AI 搜题答题 + 作业/考试自动作答」
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 可选: 在 Variables 里设置 ANSWER_SUBMIT = auto / always / never
          ANSWER_SUBMIT: ${{ vars.ANSWER_SUBMIT }}
          # 可选: 是否做作业/考试。
          #   留空 -> 填了 DEEPSEEK_API_KEY 就自动开, 没填就只刷课
          #   true / false -> 强制开关
          AUTO_ANSWER: ${{ vars.AUTO_ANSWER }}
          # 可选: 是否让程序代考。
          #   留空 / false -> 不代考(默认, 只做作业, 考试留给你自己)
          #   true         -> 考试也自动做(考试次数有限, 交了不能改, 谨慎开启)
          ANSWER_EXAM: ${{ vars.ANSWER_EXAM }}
          # 可选: 作业和刷课谁先做 (after / before / both), 默认 after
          #   after  -> 先刷课, 刷完这门再做作业/考试
          #   before -> 先做作业再刷视频
          #   both   -> 刷课前后各扫一遍
          ANSWER_ORDER: ${{ vars.ANSWER_ORDER }}
          # 可选: 设 true 时, 刷不过去的视频会把卡片/状态/上报响应存到 video_debug/
          #   用来区分「弹窗题 / 人脸采集 / 风控」, 排查完记得关掉
          VIDEO_DEBUG: ${{ vars.VIDEO_DEBUG }}
          # 可选: 开了人脸采集的视频是否直接跳过 (留空 / true -> 跳过, 默认)
          #   这类视频纯 HTTP 做不过去, 跳过它继续做本节测验比白播一遍划算
          #   设 false 可以强制照常播一遍, 用来确认是不是误判
          SKIP_FACE_CAPTURE: ${{ vars.SKIP_FACE_CAPTURE }}
          # 可选: AI 答题是否开启深度思考, 默认开启(更准, 但更慢更费 token)
          #   留空 / true -> 开启
          #   false      -> 关闭, 省 token
          AI_THINKING: ${{ vars.AI_THINKING }}
          # 单次运行时长上限(分钟):
          #   手动触发时填的值 > 仓库 Variables 里的 MAX_RUNTIME_MINUTES > 默认 110
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime || vars.MAX_RUNTIME_MINUTES || '110' }}
        run: |
          args=(-u "$CHAOXING_USERNAME" -p "$CHAOXING_PASSWORD")
          if [ -n "$CHAOXING_COURSE_LIST" ]; then
            args+=(-l "$CHAOXING_COURSE_LIST")
          fi

          # 作业/考试开关: AUTO_ANSWER 显式给了就听它的, 否则「有 Key 就开」
          auto_answer="false"
          if [ -n "$DEEPSEEK_API_KEY" ]; then auto_answer="true"; fi
          if [ -n "$AUTO_ANSWER" ]; then auto_answer="$AUTO_ANSWER"; fi

          if [ "$auto_answer" = "true" ]; then
            args+=(--auto-answer)
            if [ -n "$DEEPSEEK_API_KEY" ]; then
              args+=(--deepseek-key "$DEEPSEEK_API_KEY")
            fi
            # 深度思考: 默认开, 只有明确设成 false/0 才关
            if [ "$AI_THINKING" = "false" ] || [ "$AI_THINKING" = "0" ]; then
              args+=(--no-ai-thinking)
              echo "本次 AI 答题关闭深度思考"
            else
              args+=(--ai-thinking)
              echo "本次 AI 答题开启深度思考"
            fi
            if [ -n "$ANSWER_SUBMIT" ]; then
              args+=(--answer-submit "$ANSWER_SUBMIT")
            fi
            # 考试开关: 默认不代考, 只有明确设成 true/1 才做考试
            if [ "$ANSWER_EXAM" = "true" ] || [ "$ANSWER_EXAM" = "1" ]; then
              args+=(--exam)
              echo "本次连考试一起做(注意考试次数有限)"
            else
              args+=(--no-exam)
              echo "本次不处理考试, 只做作业 + 章节测验"
            fi
            # 作业与刷课的先后顺序
            if [ -n "$ANSWER_ORDER" ]; then
              args+=(--answer-order "$ANSWER_ORDER")
            fi
          else
            echo "本次不处理作业/考试"
          fi

          # 到点后程序自己收尾退出, 正在播的视频会播完
          args+=(--max-runtime "$MAX_RUNTIME_MINUTES")
          echo "本次运行时长上限: ${MAX_RUNTIME_MINUTES} 分钟"

          # 视频诊断: 排查「刷不过去」时打开, 诊断数据会存到 video_debug/
          if [ "$VIDEO_DEBUG" = "true" ]; then
            args+=(--video-debug)
            echo "已开启视频诊断, 诊断数据将保存到 video_debug/"
          fi

          # 人脸采集视频: 默认直接跳过(纯 HTTP 做不过去), 只有明确设 false 才照常播
          if [ "$SKIP_FACE_CAPTURE" = "false" ] || [ "$SKIP_FACE_CAPTURE" = "0" ]; then
            args+=(--no-skip-face-capture)
            echo "本次不跳过人脸采集视频, 会照常播放(用于确认是否为误判)"
          else
            echo "本次检测到人脸采集的视频会直接跳过, 不再重播"
          fi

          python main.py "${args[@]}"
